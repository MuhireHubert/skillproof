name: Deploy SkillProof web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Validate Supabase build settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://rmcrdzyzmrzgzfvkcpxn.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_7qc51MUiXCJaPJmiv3NHfg_bdwtw0Tq' }}
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is empty or unavailable to this workflow."
            missing=1
          else
            echo "VITE_SUPABASE_URL is present."
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is empty or unavailable to this workflow."
            missing=1
          else
            echo "VITE_SUPABASE_ANON_KEY is present."
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set repository/environment Actions variables or secrets if the Supabase project changes. Public client settings can use the configured fallback values in this workflow."
            exit 1
          fi

      - name: Build web app
        run: npm run build --prefix apps/web
        env:
          BASE_PATH: /skillproof/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://rmcrdzyzmrzgzfvkcpxn.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_7qc51MUiXCJaPJmiv3NHfg_bdwtw0Tq' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Add GitHub Pages SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
